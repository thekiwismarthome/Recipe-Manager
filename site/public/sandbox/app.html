<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recipe Manager demo</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: "Material Design Icons"; src: url(mdi/mdi.woff2) format("woff2"); font-display: block; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
body {
  --primary-background-color: #fafafa; --card-background-color: #ffffff; --primary-text-color: #212121;
  --secondary-text-color: #727272; --divider-color: #e0e0e0; --primary-color: #03a9f4;
  font-family: Roboto, system-ui, sans-serif;
}
recipe-manager-card { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity .25s; }
recipe-manager-card.ready { opacity: 1; }
</style>
</head>
<body>
<script src="ha-shims.js"></script>
<script src="demo-backend.js"></script>
<script>
(function () {
  // Remove anything the card saved here on a previous visit so every demo starts the same way.
  // Only the card's own keys are touched: GitHub Pages shares one origin between a user's sites.
  try {
    Object.keys(localStorage).filter(function (k) { return k.indexOf('rm_') === 0; }).forEach(function (k) { localStorage.removeItem(k); });
    Object.keys(sessionStorage).filter(function (k) { return k.indexOf('rm_') === 0; }).forEach(function (k) { sessionStorage.removeItem(k); });
  } catch (e) {}

  var q = new URLSearchParams(location.search);
  var pref = { ui: q.get('ui') || 'fresh', theme: q.get('theme') || '', mode: q.get('mode') || 'light', view: q.get('view') || 'grid', recipe: q.get('recipe') || '1' };
  var card, backend;

  function desired() {
    var s = { uiStyle: pref.ui, darkMode: pref.mode === 'dark' ? 'on' : 'off', language: 'en', unitSystem: 'imperial', showUnitConversion: true, vpeTimers: true, columns: 2 };
    if (pref.theme) s.designTheme = pref.theme;
    return s;
  }
  // Seed the saved settings before the card exists, so it starts with the chosen look
  try { localStorage.setItem('rm_settings', JSON.stringify(desired())); } catch (e) {}

  function apply() {
    if (!card) return;
    card._settings = Object.assign({}, card._settings, desired());
    card._applyTheme();
    card.requestUpdate();
  }
  function show(view) {
    if (!card) return;
    pref.view = view;
    if (view === 'detail') {
      var r = (card._recipes || []).filter(function (x) { return x.id === 'demo-recipe-' + pref.recipe; })[0];
      if (r) { card._selectedRecipe = r; card._view = 'detail'; }
    } else {
      card._selectedRecipe = null;
      card._view = view;
    }
  }

  var version = fetch('../version.json').then(function (r) { return r.json(); }).catch(function () { return {}; });
  version.then(function (v) {
    backend = createDemoBackend({ integrationVersion: v.integration || v.version, cardVersion: v.card || v.version });
    window.__backend = backend;
    import('./recipe-manager-card.js').then(function () {
      return customElements.whenDefined('recipe-manager-card');
    }).then(function () {
      card = document.createElement('recipe-manager-card');
      card.setConfig({ type: 'custom:recipe-manager-card' });
      document.body.appendChild(card);
      card.hass = backend.hass();
      // Wait for the recipes to arrive, then go to the requested screen
      var tries = 0;
      (function wait() {
        if ((card._recipes || []).length || tries++ > 40) {
          if (pref.view !== 'grid') show(pref.view);
          apply();
          setTimeout(function () { card.classList.add('ready'); parent.postMessage({ rmDemo: 'ready' }, '*'); }, 350);
        } else setTimeout(wait, 100);
      })();
    });
  });

  // The page around this demo can change the design, theme and colour mode
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d || !d.rmDemo) return;
    ['ui', 'theme', 'mode'].forEach(function (k) { if (d[k] !== undefined) pref[k] = d[k]; });
    if (d.reset && backend && card) {
      try { localStorage.removeItem('rm_shopping'); localStorage.removeItem('rm_timers'); } catch (x) {}
      backend.reset();
      card._timers = []; card._localShoppingItems = []; card._selectedRecipe = null; card._view = 'grid';
      card._loadGlobalTimers(); card._loadWeekPlan();
    }
    if (d.view) show(d.view);
    apply();
  });
})();
</script>
</body>
</html>
